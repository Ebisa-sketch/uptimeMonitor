services:
  # ─── Backend REST API Web Service ─────────────────────────────────────────
  - type: web
    name: uptimepulse-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uptimepulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false

  # ─── Autonomous Background Checker Worker ─────────────────────────────────
  - type: worker
    name: uptimepulse-worker
    env: node
    plan: free
    rootDir: worker
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uptimepulse-db
          property: connectionString
      - key: NODE_ENV
        value: production

# ─── Managed PostgreSQL Database ───────────────────────────────────────────
databases:
  - name: uptimepulse-db
    plan: free
    databaseName: uptime_db
    user: uptime_user
